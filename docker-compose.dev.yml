name: portal-dev

services:

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_GOOGLE_ANALYTICS_ID: ${VITE_GOOGLE_ANALYTICS_ID:-}
        VITE_WEB_API_URL: ${VITE_WEB_API_URL}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-10000}
        VITE_APP_NAME: ${VITE_APP_NAME:-Portal}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL}
        VITE_ADMIN_API_TIMEOUT: ${VITE_ADMIN_API_TIMEOUT:-10000}
        VITE_ADMIN_APP_NAME: ${VITE_ADMIN_APP_NAME:-Administrador}
    container_name: portal-nginx_dev
    env_file:
      - ./nginx/.env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - ckan
    networks:
      - portal_network_dev
      - webnet
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: portal-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iieg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iieg_password}
      POSTGRES_DB: ${POSTGRES_DB:-iieg_portal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iieg_user} -d ${POSTGRES_DB:-iieg_portal}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network_dev

  ckan:
    build:
      context: ./ckan
      dockerfile: Dockerfile
    env_file:
      - ./ckan/ckan.env
    depends_on:
      ckan-db:
        condition: service_healthy  
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webnet
      - ckannet
    volumes:
      - ckan_storage:/var/lib/ckan

  ckan-db:
    image: postgres:14
    environment:
      POSTGRES_USER: ckan
      POSTGRES_PASSWORD: ckanpassword
      POSTGRES_DB: ckan
    volumes:
      - ckan_pg_data:/var/lib/postgresql/data
    networks:
      - ckannet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ckan -d ckan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  solr:
    image: ckan/ckan-solr:2.10-solr9
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS"]
      interval: 30s
      timeout: 10s
      retries: 3    
    volumes:
      - solr_data:/var/solr
    networks:
      - ckannet
  
  redis:
    image: redis:8-alpine
    container_name: portal-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network_dev
      - ckannet

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: portal-api-dev
    command: ./scripts/start_backend.sh
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./.env.development
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iieg_user}:${POSTGRES_PASSWORD:-iieg_password}@postgres:5432/${POSTGRES_DB:-iieg_portal}
      REDIS_URL: redis://redis:6379/0
      ACERVO_ENDPOINT: ${ACERVO_ENDPOINT}
      ACERVO_PUBLIC_ENDPOINT: ${ACERVO_PUBLIC_ENDPOINT}
      ACERVO_ACCESS_KEY: ${ACERVO_ACCESS_KEY}
      ACERVO_SECRET_KEY: ${ACERVO_SECRET_KEY}
      ACERVO_BUCKET_NAME: ${ACERVO_BUCKET_NAME:-iieg-media}
      ACERVO_USE_SSL: ${ACERVO_USE_SSL:-false}
      ACERVO_VERIFY_SSL: ${ACERVO_VERIFY_SSL:-true}
    networks:
      - portal_network_dev

  web:
    image: node:24-alpine
    container_name: portal-web-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${WEB_PORT:-3010}:3010"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file:
      - ./.env.development
    environment:
      - VITE_PORT=3010
      - VITE_GOOGLE_ANALYTICS_ID=${VITE_GOOGLE_ANALYTICS_ID}
    networks:
      - portal_network_dev

  admin:
    image: node:24-alpine
    container_name: portal-admin-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${ADMIN_PORT:-3011}:3011"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    env_file:
      - ./.env.development
    environment:
      - VITE_PORT=3011
      - VITE_GOOGLE_ANALYTICS_ID=${VITE_GOOGLE_ANALYTICS_ID}
    networks:
      - portal_network_dev

volumes:
  postgres_data_dev:
  redis_data_dev:
  web_node_modules:
  admin_node_modules:
  ckan_storage:
  ckan_pg_data:
  solr_data:

networks:
  portal_network_dev:
    driver: bridge
  webnet:
    driver: bridge
  ckannet:
    driver: bridge
