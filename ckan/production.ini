[DEFAULT]

[server:main]
host = 0.0.0.0
port = 5000

[app:main]
ckan.site_id = datos-abiertos
ckan.site_url = http://localhost/datos-abiertos

ckan.root_path = /datos-abiertos

beaker.session.secret = 

## Base de datos (se sobreescribe con la variable de entorno)
sqlalchemy.url = postgresql://ckan:ckanpassword@ckan-db/ckan

## Plugins activos
ckan.plugins = stats
               text_view
               image_view
               recline_grid_view
               scheming_datasets
               pages
               pdf_view

## Tema
ckan.site_title = Mi Portal de Datos
ckan.site_logo = /base/images/ckan-logo.png
ckan.site_description = Portal de datos abiertos

## Internacionalización
ckan.locale_default = es
ckan.locale_order = es en

## Subida de archivos
ckan.storage_path = /var/lib/ckan
ckan.max_resource_size = 500

[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_ckan]
level = INFO
handlers = console
qualname = ckan

[logger_sqlalchemy]
level = WARNING
handlers = console
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s