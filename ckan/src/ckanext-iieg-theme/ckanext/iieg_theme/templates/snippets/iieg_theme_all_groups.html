<div class="container my-5">
    <h2 class="mb-4">{{ _('Categories') }}</h2>
    
    <div class="row g-4">
        
        <!-- Iteramos sobre todos los grupos usando nuestro nuevo helper -->
        {% for group in h.iieg_theme_all_groups() %}
            <div class="col-12 col-md-6 col-lg-4">
                <a href="{{ h.url_for('group.read', id=group.name) }}" class="text-decoration-none text-dark fw-bold">
                <div class="card h-100 group-card">
                    <div class="card-body d-flex align-items-center">
                    
                    <div class="group-image me-3">
                        
                        <img src="{{ group.image_display_url or h.url_for_static('/base/images/placeholder-group.png') }}" 
                            alt="{{ group.title or group.name }}" 
                            class="img-fluid rounded" 
                            style="max-width: 80px; max-height: 80px; object-fit: cover;">
                        
                    </div>

                    <div class="group-content flex-grow-1">
                        <h3 class="h5 card-title mb-1">
                        
                            {{ group.title or group.name }}
                        
                        </h3>


                    </div>

                    </div>
                </div>
                </a>
            </div>

            
        {% else %}
            <!-- Mensaje por si no se encuentra ningún grupo en la plataforma -->
            <div class="col-12 text-center">
                <p class="text-muted">{{ _('No se encontraron grupos disponibles.') }}</p>
            </div>
        {% endfor %}
        
    </div>
</div>
