{% set current_lang = h.lang() %}
{% set locales = h.get_available_locales() %}
{% set allowed_locales = ['es', 'en'] %}

<form class="lang-select" action="{% url_for 'util.internal_redirect' %}" method="POST">
  {{ h.csrf_input() }}
  <div class="form-group">
    <label for="field-lang-select">{{ _('Language') }}</label>
    <select id="field-lang-select" name="url" class="form-control" onchange="this.form.submit()">
      {% for locale in locales %}
        {% if locale.short_name in allowed_locales %}
        <option value="{% url_for h.current_url(), locale=locale.short_name %}" {% if locale.short_name == current_lang %}selected="selected"{% endif %}>
          {{ locale.display_name }}
        </option>
        {% endif %}
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-default d-none" type="submit">{{ _('Go') }}</button>
</form>
