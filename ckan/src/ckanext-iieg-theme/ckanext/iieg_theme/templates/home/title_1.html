
<div id="title" class="container-fluid">
    <div class="background-overlay container ">
        <div class="row restricted-max-width pt-5">
            <div class="col-xs-12 col-md-7 col-xl-8">
                <div id="title-container" class="text-left">                    
                    <h1>{{ g.site_title }}</h1>
                    {% if g.site_about %}
                    <p class="description">
                        {{ g.site_about| safe }}
                    </p>
                    {% endif %}
                </div>
                <div id="searcher" class="no-padding position-bottom mt-14">
                    {% block search %}
                        {% snippet 'home/snippets/search.html', search_facets=search_facets %}
                    {% endblock %}
                </div>                
            </div>
            <div class="col-xs-12 col-md-5 col-xl-4">
                <img src="https://iieg.jalisco.gob.mx/acervo/portal/banners/img_banner.png" alt="" class="img-fluid" />    
            </div>
        </div>
    </div>
</div>
