
<div id="title" class="container-fluid">
    <div class="background-overlay container ">
        <div class="row restricted-max-width">
            <div class="col-xs-12 col-sm-10 col-sm-offset-1">
                <div id="title-container" class="col-xs-12 col-md-7 text-left">                    
                    <h1>{{ g.site_title }}</h1>
                    {% if g.site_about %}
                    <p class="description">
                        {{ g.site_about| safe }}
                    </p>
                    {% endif %}
                </div>
                <div id="searcher" class="no-padding position-bottom mt-14">
                    {% block search %}
                        {% snippet 'home/snippets/search.html', search_facets=search_facets %}
                    {% endblock %}
                </div>                
            </div>
        </div>
    </div>
</div>
