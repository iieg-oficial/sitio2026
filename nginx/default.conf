upstream portal_web { server portal-web-dev:3010; }
upstream portal_admin { server portal-admin-dev:3011; }
upstream portal_api { server portal-api-dev:8000; }
upstream ckan_backend { server portal-ckan-dev:5000; }

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;
    absolute_redirect off;
    gzip on; gzip_vary on; gzip_min_length 1024; gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    location ^~ /api/ {
        proxy_pass http://portal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /datos-abiertos {
        rewrite ^/datos-abiertos/?(.*)$ /$1 break;
        proxy_pass http://ckan_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /datos-abiertos;
        proxy_set_header X-Forwarded-Prefix /datos-abiertos;
    }

    location / {
        proxy_pass http://portal_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt { alias /usr/share/nginx/static/robots.txt; access_log off; }
    location = /sitemap.xml { alias /usr/share/nginx/static/sitemap.xml; access_log off; }
}
