upstream portal_web {
    server portal-web-dev:3010;
}

upstream portal_admin {
    server portal-admin-dev:3011;
}

upstream portal_api {
    server portal-api-dev:8000;
}

upstream ckan_backend {
    server portal-ckan-dev:5000;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    location ^~ /api/ {
        proxy_pass http://portal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
        client_max_body_size 100M;
    }

    location ^~ /datos-abiertos {
        rewrite ^/datos-abiertos/?(.*)$ /$1 break;
        proxy_pass http://ckan_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /datos-abiertos;
        proxy_set_header X-Forwarded-Prefix /datos-abiertos;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    location ^~ /acervo/ {
        set $acervo_upstream ${ACERVO_UPSTREAM_URL};
        rewrite ^/acervo/(.*)$ /$1 break;
        proxy_pass $acervo_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host ${ACERVO_UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
        client_max_body_size 100M;
    }

    location ^~ /portal-admin {
        proxy_pass http://portal_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Let the Vite dev server handle SPA routing and static assets.
    location / {
        proxy_pass http://portal_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    location = /robots.txt {
        alias /usr/share/nginx/static/robots.txt;
        access_log off;
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/static/sitemap.xml;
        access_log off;
    }
}
